<!DOCTYPE html>
<html>
<head>
    <title>DNSentinel</title>
    <style>
        body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 15px; background: #0f172a; color: #f8fafc; }
        .domain { font-weight: bold; font-size: 1.1em; word-break: break-all; margin-bottom: 10px; }
        .score { font-size: 2em; margin: 10px 0; }
        .severity { padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .low { background: #10b98122; color: #10b981; }
        .medium { background: #f59e0b22; color: #f59e0b; }
        .high, .critical { background: #ef444422; color: #ef4444; }
        .reasons { font-size: 0.9em; color: #94a3b8; }
        .reason-list { padding-left: 20px; margin-top: 5px; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div id="content">Loading...</div>
    <script src="popup.js"></script>
</body>
</html>
