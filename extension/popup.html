<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DNSentinel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            width: 300px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            font-size: 14px;
        }

        .header {
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            color: #38bdf8;
            margin-bottom: 16px;
            text-transform: uppercase;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
        }

        .section { margin-bottom: 16px; }
        
        .label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
        
        .domain { font-weight: 600; color: #f8fafc; word-break: break-all; }
        
        .stat-row { display: flex; margin-bottom: 4px; }
        .stat-label { color: #94a3b8; width: 55px; }
        .stat-value { font-weight: bold; }
        
        /* Severity Colors */
        .val-low { color: #10b981; }
        .val-medium { color: #f59e0b; }
        .val-high { color: #f97316; }
        .val-critical { color: #ef4444; }

        .reasons-list { list-style: none; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
        .reasons-list li::before { content: "• "; color: #94a3b8; font-weight: bold; }

        .details-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: transparent;
            color: #94a3b8;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            border: 1px solid #334155;
            transition: all 0.2s;
            font-family: monospace;
            font-size: 13px;
        }
        .details-btn:hover { background: #1e293b; color: #f8fafc; }

        /* Offline */
        .offline-box { text-align: center; padding: 10px 0; }
        .offline-title { color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
        .offline-msg { color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">🛡️ DNSENTINEL</div>
    <div id="content"><div style="text-align:center;color:#94a3b8;padding:20px;">Analyzing...</div></div>
    <script src="popup.js"></script>
</body>
</html>
